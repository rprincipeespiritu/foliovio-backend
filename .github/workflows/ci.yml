name: Backend CI
on:
  push:
    branches: [dev, prd]
  pull_request:
    branches: [dev, prd]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foliovio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: foliovio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foliovio -d foliovio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://foliovio:ci-only-password@localhost:5432/foliovio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t foliovio-backend:ci .
