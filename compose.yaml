services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: foliovio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foliovio_local}
      POSTGRES_DB: foliovio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foliovio -d foliovio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
